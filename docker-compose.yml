# PolicyLens — local stack.
#
#   docker compose up --build        start the API on http://localhost:8000
#   docker compose run --rm eval     run the evaluation harness and write reports/
#
# No API key is needed for either. To use a real LLM, put the key in a .env file
# (see .env.example); compose passes it through when present.

services:
  api:
    build: .
    image: policylens:latest
    ports:
      - "8000:8000"
    environment:
      # Default to the keyless path so the stack works out of the box. Override
      # POLICYLENS_LLM_PROVIDER in .env to use a model.
      POLICYLENS_LLM_PROVIDER: "${POLICYLENS_LLM_PROVIDER:-none}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    restart: unless-stopped

  # One-shot: writes timestamped JSON/CSV/Markdown into ./reports on the host.
  eval:
    build: .
    image: policylens:latest
    profiles: ["tools"]
    environment:
      POLICYLENS_LLM_PROVIDER: "${POLICYLENS_LLM_PROVIDER:-none}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - ./reports:/app/reports
    command: ["python", "-m", "policylens.cli", "eval", "--split", "test", "--sweep", "--ablation"]
