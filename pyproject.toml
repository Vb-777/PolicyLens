[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policylens"
version = "0.1.0"
description = "Graph-augmented RAG over insurance policy wordings, with a measured evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Barsaiyan" }]
keywords = ["rag", "retrieval", "knowledge-graph", "insurance", "llm", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
]

# The core pipeline runs with no API key and no pretrained weights. Anything that
# needs the network lives in an optional extra, so a clone-and-test works offline.
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "faiss-cpu>=1.8",
  "networkx>=3.2",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pypdf>=4.2",
]

[project.optional-dependencies]
# Pretrained embedding and cross-encoder reranking backends.
quality = ["sentence-transformers>=3.0"]
# Regenerating the PDF corpus from the text sources.
corpus = ["reportlab>=4.0"]
# One provider per key you actually hold; none of them are required.
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
policylens = "policylens.cli:main"

[project.urls]
Repository = "https://github.com/Vb-777/policylens"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "B008",   # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
